{% extends "base.html" %}

{% block content %}
<div style="max-width: 580px; margin: 30px auto; padding: 0 16px;">
    
    <a href="{% if user.is_staff %}{% url 'custom_admin_portal' %}{% else %}{% url 'dashboard' %}{% endif %}" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #7a1e36; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px;">
        ← Back
    </a>

    <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
        <h2 style="margin: 0 0 6px 0; color: #0f172a; font-size: 1.4rem; font-weight: 800;">Change Account Password</h2>
        <p style="margin: 0 0 24px 0; color: #64748b; font-size: 0.88rem;">Update the access key for user: <strong style="color: #0f172a;">{{ request.user.username }}</strong></p>

        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;">Current Password *</label>
                <input type="password" name="old_password" required placeholder="Enter your current password" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc;">
            </div>

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;">New Password *</label>
                <input type="password" name="new_password1" required placeholder="Minimum 8 characters" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc;">
            </div>

            <div style="margin-bottom: 26px;">
                <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;">Confirm New Password *</label>
                <input type="password" name="new_password2" required placeholder="Re-enter new password" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc;">
            </div>

            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
                <a href="{% if user.is_staff %}{% url 'custom_admin_portal' %}{% else %}{% url 'dashboard' %}{% endif %}" style="padding: 10px 18px; border-radius: 8px; text-decoration: none; color: #64748b; font-weight: 600; font-size: 0.9rem;">Cancel</a>
                <button type="submit" style="background: #420f1c; color: #ffffff; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; box-shadow: 0 2px 6px rgba(66, 15, 28, 0.2);">
                    Update Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
