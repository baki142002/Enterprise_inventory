{% extends "base.html" %}

{% block title %}Edit User — Enterprise Operations{% endblock %}

{% block content %}
<div class="page-head">
  <div class="page-title">
    <div>
      <h1>Edit User: {{ target_user.username }}</h1>
      <p class="muted">Update account details, active status, and role permissions.</p>
    </div>
    <a href="/inventory/management/administration/" class="btn btn-secondary">Back to Admin</a>
  </div>
</div>

<div class="card" style="max-width: 580px;">
  <form method="post">
    {% csrf_token %}

    <div class="form-group" style="margin-bottom: 14px;">
      <label style="display:block; font-weight:600; margin-bottom:6px;">Username</label>
      <input type="text" name="username" value="{{ target_user.username }}" required>
    </div>

    <div class="form-group" style="margin-bottom: 14px;">
      <label style="display:block; font-weight:600; margin-bottom:6px;">First name</label>
      <input type="text" name="first_name" value="{{ target_user.first_name }}">
    </div>

    <div class="form-group" style="margin-bottom: 14px;">
      <label style="display:block; font-weight:600; margin-bottom:6px;">Last name</label>
      <input type="text" name="last_name" value="{{ target_user.last_name }}">
    </div>

    <div class="form-group" style="margin-bottom: 18px;">
      <label style="display:block; font-weight:600; margin-bottom:6px;">Email address</label>
      <input type="email" name="email" value="{{ target_user.email }}">
    </div>

    <div style="margin-bottom: 20px; display:flex; flex-direction:column; gap:10px;">
      <label style="display:flex; align-items:center; gap:8px; font-weight:600; cursor:pointer;">
        <input type="checkbox" name="is_active" {% if target_user.is_active %}checked{% endif %}>
        <span>Active account</span>
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-weight:600; cursor:pointer;">
        <input type="checkbox" name="is_staff" {% if target_user.is_staff %}checked{% endif %}>
        <span>Staff status</span>
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-weight:600; cursor:pointer;">
        <input type="checkbox" name="is_superuser" {% if target_user.is_superuser %}checked{% endif %}>
        <span>Superadmin privileges</span>
      </label>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/inventory/management/administration/" class="btn btn-secondary" style="background: transparent; color: #5b1824; border: 1px solid #5b1824;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
