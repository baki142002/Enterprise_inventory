{% extends "base.html" %}

{% block content %}
<div style="max-width: 680px; margin: 30px auto; padding: 0 16px;">
    
    <a href="{% url 'custom_admin_portal' %}" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #7a1e36; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px;">
        ← Back to Administration
    </a>

    <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
        <h2 style="margin: 0 0 6px 0; color: #0f172a; font-size: 1.4rem; font-weight: 800;">Create System User</h2>
        <p style="margin: 0 0 24px 0; color: #64748b; font-size: 0.88rem;">Provision a new account with defined system role and permissions.</p>

        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;">Username *</label>
                <input type="text" name="username" required placeholder="e.g. rubenjohn" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc;">
            </div>

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;">Email Address</label>
                <input type="email" name="email" placeholder="user@company.com" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;">System Role *</label>
                <select name="role" required style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc;">
                    <option value="operator">Operator (General Inventory & POS Tasks)</option>
                    <option value="staff">Staff (Administrative Read/Write)</option>
                    <option value="superuser">Superadmin (Unrestricted Governance)</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px;">
                <div>
                    <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;">Initial Password *</label>
                    <input type="password" name="password" required placeholder="Minimum 8 characters" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;">Confirm Password *</label>
                    <input type="password" name="confirm_password" required placeholder="Re-enter password" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc;">
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
                <a href="{% url 'custom_admin_portal' %}" style="padding: 10px 18px; border-radius: 8px; text-decoration: none; color: #64748b; font-weight: 600; font-size: 0.9rem;">Cancel</a>
                <button type="submit" style="background: #420f1c; color: #ffffff; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; box-shadow: 0 2px 6px rgba(66, 15, 28, 0.2);">
                    Create Account
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
