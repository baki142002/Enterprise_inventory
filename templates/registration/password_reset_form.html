<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · StockPilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .reset-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            text-align: center;
        }
        .icon-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: rgba(66, 15, 28, 0.08);
            color: #420f1c;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }
        p {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #334155;
            margin-bottom: 8px;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
            color: #0f172a;
        }
        input[type="email"]:focus {
            border-color: #420f1c;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(66, 15, 28, 0.12);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #420f1c;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(66, 15, 28, 0.25);
        }
        .btn-submit:hover {
            background: #5c1627;
            transform: translateY(-1px);
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #7a1e36;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="icon-box">🔑</div>
    <h2>Reset Password</h2>
    <p>Forgotten your password? Enter your email address below, and we'll dispatch instructions for setting a new one.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_email">Email address</label>
            <input type="email" name="email" id="id_email" required placeholder="name@company.com" autocomplete="email">
        </div>

        <button type="submit" class="btn-submit">Reset my password</button>
    </form>

    <a href="{% url 'login' %}" class="back-link">← Return to Login</a>
</div>

</body>
</html>
