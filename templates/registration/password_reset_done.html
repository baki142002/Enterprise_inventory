<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent · StockPilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 40px 32px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .icon { width: 56px; height: 56px; border-radius: 14px; background: rgba(66, 15, 28, 0.08); color: #420f1c; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 20px; }
        h2 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
        p { font-size: 0.9rem; color: #64748b; line-height: 1.5; margin-bottom: 24px; }
        .btn { display: block; width: 100%; padding: 12px; background: #420f1c; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
        .btn:hover { background: #5c1627; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✉️</div>
    <h2>Instructions Sent</h2>
    <p>We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
    <a href="{% url 'login' %}" class="btn">Return to Sign In</a>
</div>
</body>
</html>
